<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登入失敗 — Fin8d</title>
  <link rel="stylesheet" href="/mockup/assets/mockup.css" />
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-brand"><h1>Fin<span style="color:var(--primary)">8</span>d</h1><p>雲端財務系統</p></div>
      <div class="alert alert-error">Email 或密碼錯誤，請再試一次。<span class="flow-tag flow-tag-neg">FL-AUTH-01 N1</span></div>
      <div class="form-group" style="margin-bottom:1rem"><label>Email</label><input class="form-control field-error" type="email" value="wrong@example.com" /></div>
      <div class="form-group" style="margin-bottom:1.5rem"><label>密碼</label><input class="form-control field-error" type="password" value="••••••" /><p class="hint-error">帳號或密碼不正確</p></div>
      <button class="btn btn-primary" style="width:100%;justify-content:center">登入</button>
      <p style="text-align:center;margin-top:1rem;font-size:0.85rem"><a href="/mockup/password-reset-request.html">忘記密碼？</a></p>
    </div>
  </div>
  <div class="tag-mockup"><a href="/mockup/index.html" style="color:#fff">Mockup · 反向</a></div>
  <script src="/mockup/assets/mockup-nav.js"></script>

</html>
