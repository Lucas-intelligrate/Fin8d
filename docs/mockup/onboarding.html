<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>初始設定 — Fin8d</title>
  <link rel="stylesheet" href="assets/mockup.css" />
</head>
<body style="background:var(--bg);min-height:100vh;padding:2rem">
  <div style="max-width:640px;margin:0 auto">
    <h1 style="margin-bottom:0.5rem">歡迎使用 Fin8d</h1>
    <p style="color:var(--muted);margin-bottom:2rem">完成以下步驟以開始使用 <span class="flow-tag">FL-SYS-08</span></p>
    <div class="card" style="margin-bottom:1rem"><div class="card-body" style="display:flex;gap:1rem;align-items:center">
      <span style="color:var(--success)">✓</span><div><strong>1. 公司基本資料</strong><p style="font-size:0.85rem;color:var(--muted)">智滙科技股份有限公司</p></div>
    </div></div>
    <div class="card" style="margin-bottom:1rem;border-color:var(--primary)"><div class="card-body" style="display:flex;gap:1rem;align-items:center">
      <span>2</span><div style="flex:1"><strong>匯入會計科目</strong>
        <select class="form-control" style="margin-top:0.5rem"><option>台灣一般行業範本</option><option>空白</option></select>
      </div>
    </div></div>
    <div class="card" style="margin-bottom:1rem;opacity:0.6"><div class="card-body"><strong>3. 建立會計期間</strong></div></div>
    <div class="card" style="margin-bottom:1.5rem;opacity:0.6"><div class="card-body"><strong>4. 邀請團隊成員</strong></div></div>
    <button class="btn btn-primary">下一步</button>
    <div class="alert alert-warning" style="margin-top:1.5rem">反向 N1：跳過必填步驟 → 無法進入主功能</div>
  </div>
  <div class="tag-mockup"><a href="index.html" style="color:#fff">Mockup</a></div>
</body>
</html>
