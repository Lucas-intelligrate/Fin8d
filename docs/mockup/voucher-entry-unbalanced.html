<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>傳票借貸不平衡 — Fin8d</title>
  <link rel="stylesheet" href="/mockup/assets/mockup.css" />
</head>
<body>
<div class="app-shell">
  <aside class="sidebar"><div class="sidebar-brand">Fin<span>8</span>d</div><nav>
    <a class="nav-link active" href="/mockup/voucher-entry.html">新增傳票</a>
  </nav></aside>
  <div class="main">
    <header class="topbar"><div class="breadcrumb">總帳 / <strong>新增傳票</strong></div></header>
    <div class="content">
      <div class="alert alert-error">借貸不平衡：差额 NT$ 200 <span class="flow-tag flow-tag-neg">FL-GL-01 N1</span></div>
      <div class="card"><div class="card-header">分錄明細</div>
        <div class="card-body table-wrap" style="padding:0"><table>
          <thead><tr><th>#</th><th>科目</th><th>摘要</th><th class="text-right">借方</th><th class="text-right">貸方</th></tr></thead>
          <tbody>
            <tr><td>1</td><td>5202 文具用品</td><td>文具</td><td class="text-right">1,000</td><td class="text-right">—</td></tr>
            <tr><td>2</td><td>1101 現金</td><td>付現</td><td class="text-right">—</td><td class="text-right">800</td></tr>
          </tbody>
        </table></div>
        <div class="card-body" style="border-top:1px solid var(--border);text-align:right">
          <span style="margin-right:1rem">借方 <strong>1,000</strong></span>
          <span style="margin-right:1rem">貸方 <strong>800</strong></span>
          <span class="balance-error">✕ 差额 200</span>
        </div>
      </div>
      <button class="btn btn-outline">存草稿</button>
      <button class="btn btn-primary" disabled title="借貸须平衡">送審</button>
    </div>
  </div>
</div>
<div class="tag-mockup"><a href="/mockup/voucher-entry.html" style="color:#fff">← 正向</a></div>
  <script src="/mockup/assets/mockup-nav.js"></script>
</body>
</html>
