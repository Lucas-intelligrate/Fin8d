  <title>業務整合流程 — Fin8d Phase 3</title>
  <link rel="stylesheet" href="/mockup/assets/mockup.css" />
  <style>
    .flow-diagram { background:#fff;border:1px solid var(--border);border-radius:12px;padding:2rem;text-align:center }
    .flow-row { display:flex;align-items:center;justify-content:center;gap:0.5rem;flex-wrap:wrap;margin:1rem 0 }
    .flow-box { background:#e0f2fe;border:2px solid var(--primary);border-radius:8px;padding:0.75rem 1.25rem;font-weight:600;font-size:0.9rem }
    .flow-box.gl { background:#dcfce7;border-color:var(--success) }
    .flow-box.inv { background:#fef3c7;border-color:var(--warning) }
    .flow-arrow { color:var(--muted);font-size:1.25rem }
  </style>
</head>
<body>

      <div class="content">
        <div class="card"><div class="card-header">銷售流程（正向）</div><div class="card-body flow-diagram">

        </div></div>

            <span class="flow-box gl">借 銀行 / 貸 應收</span>

        </div></div>
      </div>
