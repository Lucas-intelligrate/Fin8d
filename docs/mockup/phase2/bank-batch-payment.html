<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>批次收付 — Fin8d Phase 2</title>
  <link rel="stylesheet" href="/mockup/assets/mockup.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar"><div class="sidebar-brand">Fin<span>8</span>d</div><nav><a class="nav-link active" href="/mockup/phase2/bank-batch-payment.html">批次收付</a><a class="nav-link" href="/mockup/phase2/forex-settlement.html">匯兌損益</a></nav></aside>
    <div class="main">
      <header class="topbar"><div class="breadcrumb">銀行 / <strong>批次付款</strong></div><div class="topbar-actions"><button class="btn btn-primary">產生付款檔</button></div></header>
      <div class="content">
        <div class="toolbar">
          <div class="form-group"><label>付款銀行</label><select class="form-control"><option>822 台新 ···1234</option></select></div>
          <div class="form-group"><label>付款日期</label><input class="form-control" type="date" value="2026-09-15" /></div>
        </div>
        <div class="card"><div class="card-body table-wrap">
          <table>
            <thead><tr><th><input type="checkbox" /></th><th>廠商</th><th>憑單號</th><th>帳號</th><th class="text-right">金額</th></tr></thead>
            <tbody>
              <tr><td><input type="checkbox" checked /></td><td>V001 文具供應</td><td>AP202609-0042</td><td>013 ···5678</td><td class="text-right">45,600</td></tr>
              <tr><td><input type="checkbox" checked /></td><td>V002 雲端主機</td><td>AP202609-0038</td><td>822 ···9012</td><td class="text-right">128,000</td></tr>
            </tbody>
            <tfoot><tr><td colspan="4" class="text-right"><strong>合計</strong></td><td class="text-right"><strong>173,600</strong></td></tr></tfoot>
          </table>
        </div></div>
        <div class="alert alert-info">可匯出銀行 TXT/CSV 格式，完成後批次產生付款傳票</div>
      </div>
    </div>
  </div>
  <div class="tag-mockup">Phase 2 Mockup</div>
  <script src="/mockup/assets/mockup-nav.js"></script>
</body>
</html>
