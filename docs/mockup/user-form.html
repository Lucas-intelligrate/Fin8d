<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fin8d — 新增使用者</title>
  <link rel="stylesheet" href="/mockup/assets/mockup.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-brand">Fin8d</div>
      <nav class="sidebar-nav">
        <a href="/mockup/settings.html" class="nav-item active">系統設定</a>
      </nav>
    </aside>
    <main class="main-content">
      <header class="topbar"><h1>新增使用者</h1></header>
      <div class="content-area">
        <div class="card" style="max-width:480px;">
          <div class="form-group">
            <label>Email</label>
            <input type="email" placeholder="user@company.com">
          </div>
          <div class="form-group">
            <label>姓名</label>
            <input type="text" placeholder="王小明">
          </div>
          <div class="form-group">
            <label>角色</label>
            <select><option>會計人員</option><option>會計主管</option><option>系統管理員</option></select>
          </div>
          <button class="btn btn-primary">建立並發送邀請</button>
          <p style="margin-top:0.75rem;font-size:0.85rem;color:var(--text-muted);">流程：SYS-02 正向 · 新增使用者</p>
        </div>
      </div>
    </main>
  </div>
  <script src="/mockup/assets/mockup-nav.js"></script>
</body>
</html>
