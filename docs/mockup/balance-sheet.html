<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>資產負債表 — Fin8d</title>
  <link rel="stylesheet" href="/mockup/assets/mockup.css" />
</head>
<body>
<div class="app-shell">
  <aside class="sidebar"><div class="sidebar-brand">Fin<span>8</span>d</div><nav>
    <a class="nav-link" href="/mockup/trial-balance.html">試算表</a>
    <a class="nav-link active" href="/mockup/balance-sheet.html">資產負債表</a>
    <a class="nav-link" href="/mockup/income-statement.html">損益表</a>
    <a class="nav-link" href="/mockup/account-ledger.html">科目餘額</a>
  </nav></aside>
  <div class="main">
    <header class="topbar"><div class="breadcrumb">報表 / <strong>資產負債表</strong></div></header>
    <div class="content">
      <div class="card"><div class="card-body">
        <div class="toolbar">
          <div class="form-group" style="max-width:160px"><label>截止日</label><input class="form-control" type="date" value="2026-09-30" /></div>
          <button class="btn btn-primary">產生報表</button>
          <span class="flow-tag">FL-RPT-02</span>
        </div>
        <div class="grid-2" style="margin-top:1rem">
          <div><h3 style="font-size:0.95rem;margin-bottom:0.75rem">資產</h3>
            <table><tr><td>1101 現金</td><td class="text-right">8,500</td></tr><tr><td>1102 銀行存款</td><td class="text-right">375,000</td></tr><tr><td>1141 應收帳款</td><td class="text-right">95,000</td></tr><tr style="font-weight:700"><td>資產合計</td><td class="text-right">478,500</td></tr></table>
          </div>
          <div><h3 style="font-size:0.95rem;margin-bottom:0.75rem">負債及權益</h3>
            <table><tr><td>2101 應付帳款</td><td class="text-right">39,000</td></tr><tr><td>3201 保留盈餘</td><td class="text-right">439,500</td></tr><tr style="font-weight:700"><td>負債+權益合計</td><td class="text-right">478,500</td></tr></table>
          </div>
        </div>
        <p class="balance-ok" style="margin-top:1rem">✓ 資產 = 負債 + 權益</p>
      </div></div>
    </div>
  </div>
</div>
<div class="tag-mockup"><a href="/mockup/index.html" style="color:#fff">Mockup</a></div>
  <script src="/mockup/assets/mockup-nav.js"></script>

</html>
